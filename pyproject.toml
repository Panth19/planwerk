[project]
name = "planwerk"
version = "0.9.0"
description = "Sozialplan calculator: turns labour-law restructuring Excel models into a tested web app, an MCP server and an AI assistant."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "openpyxl>=3.1",
    "fastapi>=0.110",
    "python-multipart>=0.0.9",  # file uploads in FastAPI
    "uvicorn>=0.29",
    "httpx>=0.27",              # local model route
]

[project.optional-dependencies]
mcp = ["mcp>=2.0"]
ai = ["anthropic>=0.40"]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.10", "mcp>=2.0", "anthropic>=0.40"]

[project.scripts]
planwerk = "planwerk.cli:main"
planwerk-mcp = "planwerk.mcp_server:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "libreoffice: needs a headless LibreOffice (soffice) on PATH",
    "node: needs Node.js on PATH",
    "browser: needs Playwright with Chromium",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["planwerk*"]

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["dist"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = [
    "RUF001",  # ambiguous unicode: German text with en dashes and × is intended
    "RUF002",
    "RUF003",
]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
check_untyped_defs = true
